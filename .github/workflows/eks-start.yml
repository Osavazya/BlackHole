name: EKS start (create if missing)

on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/eks-start.yml"

permissions:
  id-token: write
  contents: read

env:
  # обязательные
  AWS_REGION:            ${{ secrets.AWS_REGION }}
  EKS_CLUSTER:           ${{ secrets.EKS_CLUSTER }}
  # опционально: OIDC роль; если пусто — используем AK/SK
  ROLE_TO_ASSUME:        ${{ secrets.ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- AWS creds через OIDC роль, если задана ---
      - name: Configure AWS (OIDC role)
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: gha-eks-start
          aws-region: ${{ env.AWS_REGION }}

      # --- иначе — по access keys из секретов ---
      - name: Configure AWS (access keys)
        if: ${{ env.ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install eksctl & kubectl
        run: |
          set -euo pipefail
          curl -sSL https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          curl -sSL -o kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          eksctl version
          kubectl version --client=true --output=yaml

      - name: Create cluster if missing
        run: |
          set -euo pipefail
          if aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER" >/dev/null 2>&1; then
            echo "Cluster $EKS_CLUSTER already exists in $AWS_REGION — skip create."
          else
            echo "Creating cluster $EKS_CLUSTER in $AWS_REGION ..."
            # максимально простой и валидный вызов без heredoc/eksctl.yml
            eksctl create cluster \
              --name "$EKS_CLUSTER" \
              --region "$AWS_REGION" \
              --version "1.30" \
              --managed \
              --nodegroup-name "ng-default" \
              --nodes 2 \
              --nodes-min 1 \
              --nodes-max 3 \
              --instance-types "t3.medium" \
              --with-oidc \
              --timeout 40m
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # сюда при желании добавишь деплой контроллеров/приложения (helm/kubectl/kustomize)
      # - name: Deploy app
      #   run: kubectl apply -k k8s/overlays/dev
