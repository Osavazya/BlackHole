name: eks-stop

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "EKS cluster name"
        required: true
        default: blackhole-eks-dev
      region:
        description: "AWS region"
        required: true
        default: eu-south-2
      nuke_orphans:
        description: "Delete orphan ALBs/TGs/SGs (true/false)"
        required: true
        default: "true"

  push:
    branches:
      - feat/k8s-ci         # дай свою ветку, если другая
    paths:
      - .github/workflows/eks-stop.yml

concurrency:
  group: eks-stop-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest

    env:
      # значения из inputs, fallback к secrets
      AWS_REGION: ${{ github.event.inputs.region || secrets.AWS_REGION }}
      EKS_CLUSTER: ${{ github.event.inputs.cluster || secrets.EKS_CLUSTER }}
      NUKE_ORPHANS: ${{ github.event.inputs.nuke_orphans || 'true' }}

      # секреты заводим в env — и проверяем через env.*
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC-роль, если есть
      - name: Configure AWS (OIDC role)
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: gha-eks-stop
          aws-region: ${{ env.AWS_REGION }}

      # иначе ключи
      - name: Configure AWS (access keys)
        if: ${{ env.ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install eksctl
        run: |
          set -euo pipefail
          if ! command -v eksctl >/dev/null; then
            curl -sSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin eksctl
          fi
          eksctl version

      - name: Show target
        run: |
          set -euo pipefail
          echo "Region  : $AWS_REGION"
          echo "Cluster : $EKS_CLUSTER"
          aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" \
            --query "cluster.status" || echo "Cluster not found (ok)"

      - name: Delete EKS cluster (wait)
        run: |
          set -euo pipefail
          if aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            eksctl delete cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" \
              --disable-nodegroup-eviction --wait
          else
            echo "Cluster $EKS_CLUSTER not found in $AWS_REGION — skipping eksctl delete."
          fi

      - name: Nuke orphan ELBv2 resources (optional)
        if: ${{ env.NUKE_ORPHANS == 'true' }}
        run: |
          set -euo pipefail
          echo "Looking for orphan k8s ELBv2 resources in $AWS_REGION ..."
          # ALBs/NLBs (k8s-*)
          lbs=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?starts_with(DNSName, 'k8s-')].[LoadBalancerArn]" \
            --output text || true)
          for lb in $lbs; do
            echo "Deleting LB $lb"
            aws elbv2 delete-load-balancer --region "$AWS_REGION" --load-balancer-arn "$lb" || true
          done
          # Target Groups (k8s-*)
          tgs=$(aws elbv2 describe-target-groups --region "$AWS_REGION" \
            --query "TargetGroups[?starts_with(TargetGroupName, 'k8s-')].TargetGroupArn" \
            --output text || true)
          for tg in $tgs; do
            echo "Deleting TG $tg"
            aws elbv2 delete-target-group --region "$AWS_REGION" --target-group-arn "$tg" || true
          done
          # Security Groups, помеченные кластером
          sgs=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
            --filters "Name=tag:kubernetes.io/cluster/${EKS_CLUSTER},Values=owned,shared" \
            --query "SecurityGroups[].GroupId" --output text || true)
          for sg in $sgs; do
            echo "Deleting SG $sg"
            aws ec2 delete-security-group --region "$AWS_REGION" --group-id "$sg" || true
          done

      - name: ExternalDNS / Cloudflare cleanup (optional)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -n "${CF_ZONE_ID:-}" ]; then
            if ! command -v jq >/dev/null; then sudo apt-get update -y && sudo apt-get install -y jq; fi
            DNS_NAME="app-k8s.blackhole.bond"
            rec_id=$(curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=CNAME&name=$DNS_NAME" \
              | jq -r '.result[0].id // empty')
            if [ -n "$rec_id" ]; then
              echo "Deleting Cloudflare CNAME $DNS_NAME ($rec_id)"
              curl -sS -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$rec_id" >/dev/null
            else
              echo "No Cloudflare record $DNS_NAME — nothing to delete."
            fi
          else
            echo "CF_ZONE_ID not set — skip Cloudflare cleanup."
          fi

      - name: Show leftovers (sanity check)
        run: |
          set -euo pipefail
          echo "Clusters left:"
          aws eks list-clusters --region "$AWS_REGION"
          echo "eksctl* stacks left:"
          aws cloudformation list-stacks --region "$AWS_REGION" \
            --query "StackSummaries[?contains(StackName, \`eksctl-\`) && StackStatus!='DELETE_COMPLETE'].[StackName,StackStatus]" \
            --output table
          echo "ELBv2 left:"
          aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[?starts_with(DNSName, 'k8s-')].[LoadBalancerName,DNSName]" \
            --output table
